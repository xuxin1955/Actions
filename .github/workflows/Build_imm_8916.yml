name: Build_imm_8916

on:
  schedule:
   - cron: '0 17 * * 6'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-msm8916
  cancel-in-progress: false

env:
  ALL_DEVICES: "jz02v10 ufi001c ufi001b ufi103s qrzl903 w001 ufi003 uz801 mf32 mf601 wf2 sp970v11 sp970v10"
  BASE_CONFIG: config/jz02v10.config
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
       contents: write
       actions: write

    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: false

    - name: apt update
      id: init
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        DEPS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        sudo -E apt-get -y install --no-install-recommends $DEPS
        echo "status=success" >> "$GITHUB_OUTPUT"
        
    - name: mkbootimg build
      run: |
        DEB="$GITHUB_WORKSPACE/scripts/mkbootimg_34.0.5-12build1_all.deb"
        if [ -f "$DEB" ]; then
          sudo dpkg -i "$DEB"
          sudo apt-get install -f -y
          mkbootimg --help || true
        else
          echo "::warning::$DEB 不存在，跳过 mkbootimg"
        fi
        sudo timedatectl set-timezone "${TZ}"
        echo "status=success" >> ${GITHUB_OUTPUT}
        
        sudo chmod 777 /mnt
        df -hT

    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "===== 源码最近更新 (最后 10 条) ====="
        git -C /mnt/openwrt log -10 --oneline --no-merges
        echo "===== generic 补丁目录 ====="
        ls -d /mnt/openwrt/target/linux/generic/hack-* 2>/dev/null || true

    - name: Load custom DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

        echo "📌 Local packages feed:"
        git -C feeds/packages log -1 --format="%H %ci %s"

        echo "📌 Actual remote of feeds/packages:"
        git -C feeds/packages remote get-url origin

        echo "📌 Remote HEAD actually used:"
        git -C feeds/packages ls-remote HEAD || true

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a -f


    - name: Load custom DIY_P2_SH
      run: |
        cp $BASE_CONFIG openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 转 multi-profile
      run: |
        cd openwrt

        sed -i '/^CONFIG_TARGET_PROFILE=/d' .config
        sed -i '/^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-.*=y$/d' .config
        sed -i '/^CONFIG_DEFAULT_qcom-msm8916-.*openstick-.*=y$/d' .config
        sed -i '/^CONFIG_PACKAGE_qcom-msm8916-.*openstick-.*=y$/d' .config

        if grep -q '^# CONFIG_TARGET_MULTI_PROFILE is not set' .config; then
          sed -i 's|^# CONFIG_TARGET_MULTI_PROFILE is not set|CONFIG_TARGET_MULTI_PROFILE=y|' .config
        fi
        grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' .config || echo 'CONFIG_TARGET_MULTI_PROFILE=y' >> .config
        grep -q '^CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config || echo 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' >> .config

        for d in $ALL_DEVICES; do
          echo "CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-$d=y" >> .config
        done

        echo "===== 追加后设备数 ====="
        grep -c '^CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-' .config

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: make defconfig
      run: |
        cd openwrt
        make defconfig V=s

    - name: Cache host tools
      uses: actions/cache@v5
      with:
        path: |
          /mnt/openwrt/staging_dir/host
          /mnt/openwrt/build_dir/host
        key: tools-${{ github.run_id }}
        restore-keys: tools-

    - name: Cache toolchain
      uses: actions/cache@v5
      with:
        path: |
          /mnt/openwrt/staging_dir/toolchain-*
          /mnt/openwrt/build_dir/toolchain-*
        key: tc-${{ github.run_id }}
        restore-keys: tc-

    - name: 查看 openwrt 目录
      run: |
        ls -la openwrt/
        ls -la openwrt/.config

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config-multi-profile
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true

    - name: Cache dl
      id: cache-dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-immortalwrt-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          dl-${{ runner.os }}-immortalwrt-

    - name: Download package
      run: |
        cd openwrt
        [ "${{ steps.cache-dl.outputs.cache-hit }}" = "true" ] && echo "cache hit" || echo "cache miss"
        output=$(make download -j$(nproc) -k V=s 2>&1)
        if echo "$output" | grep -qiE "Hash verification failed|checksum mismatch|ERROR"; then
          echo "===== download errors ====="
          echo "$output" | grep -iE "Hash verification failed|checksum mismatch|ERROR"
        fi
      shell: bash

    - name: 预检内核补丁兼容性
      run: |
        chmod +x "$GITHUB_WORKSPACE/scripts/msm89xx/check-kernel-patches-8916.sh"
        bash "$GITHUB_WORKSPACE/scripts/msm89xx/check-kernel-patches-8916.sh" "$GITHUB_WORKSPACE/openwrt"
      shell: bash

    - name: make -j$(nproc)
      id: compile
      run: |
        cd openwrt

        echo -e "$(nproc) thread compile"

        set +e
        make -j$(nproc)
        BUILD_EXIT=$?
        set -e

        if [ $BUILD_EXIT -ne 0 ]; then
          echo "⚠️ 并行编译失败，切换到详细模式..."
          set +e
          make -j8 V=s
          VERBOSE_EXIT=$?
          set -e
          [ $VERBOSE_EXIT -ne 0 ] && exit $VERBOSE_EXIT
          echo "✅ 详细模式编译成功"
        else
          echo "✅ 并行编译成功"
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_multi13" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "===== 产物清单 ====="
        ls -1 bin/targets/msm89xx/msm8916/ 2>/dev/null || true
        echo "sysupgrade 数量: $(ls -1 bin/targets/msm89xx/msm8916/*squashfs-sysupgrade.bin 2>/dev/null | wc -l)"
      shell: bash

    - name: df -hT
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Prefix common
      if: steps.organize.outputs.status == 'success'
      run: |
        cd ${{ env.FIRMWARE }}
        rm -f config.buildinfo \
              feeds.buildinfo \
              profiles.json \
              sha256sums \
              version.buildinfo
      shell: bash

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Cleanup old workflow runs
      if: success()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        WF="${GITHUB_WORKFLOW_REF%%@*}"; WF="${WF##*/}"
        gh run list -w "$WF" --status=completed --limit=1000 \
          --json databaseId --jq ".[].databaseId | select(. != $GITHUB_RUN_ID)" |
        while read -r id; do
          gh run delete "$id" >/dev/null 2>&1 \
            && echo "Deleted run $id" \
            || echo "::warning::run $id delete failed"
        done

  release:
    name: 汇总发布 Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    if: needs.build.result == 'success' && !cancelled()
    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Collect firmware artifacts
      uses: actions/download-artifact@main
      with:
        pattern: OpenWrt_firmware*
        merge-multiple: true
        path: firmware

    - name: Organize output
      run: |
        mkdir -p out
        find firmware -type f -exec mv {} out/ \;
        echo "FIRMWARE=$PWD/out" >> $GITHUB_ENV
        echo "===== files ====="
        find out -type f

    - name: Generate release tag
      id: tag
      env:
        MIRROR: https://gh-proxy.com/
      run: |
        MIRROR="${MIRROR:-https://gh-proxy.com/}"
        TAG="MSM8916-$(date +%Y.%m.%d)-V${GITHUB_RUN_NUMBER}"
        NAME="MSM8916-$(date +%Y.%m.%d-%H%M)"
        { echo "release_tag=$TAG"; echo "release_name=$NAME"; } >> $GITHUB_OUTPUT

        cp -f "$GITHUB_WORKSPACE/scripts/flash.zip" "${{ env.FIRMWARE }}/刷机小工具-flash.zip" 2>/dev/null || true

        KVER=$(grep -h "kmod-usb-core" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F' - ' '{print $2}' | grep -oP '[0-9]+\.[0-9]+(\.[0-9]+)?([-~]?rc[0-9]+)?' | head -1 || true)

        {
          echo "## 高通8916系列 immortalwrt"
          echo ""
          echo "- 编译时间: $(date +"%Y-%m-%d %H:%M")"
          echo "- 内核版本: ${KVER:-未知}"
          echo "- 管理地址: 192.168.10.1"
          echo "- 默认账号: root / 空密码"
          echo "- 源码: ${{ env.REPO_URL }}"
          echo "- 分支: ${{ env.REPO_BRANCH }}"
          echo "- 刷机小工具: 见下方加速表格或 Assets：\`刷机小工具-flash.zip\`"
          echo ""
          echo "<details>"
          echo "<summary>支持机型</summary>"
          echo ""
          for m in ${{ env.ALL_DEVICES }}; do echo "- ${m}"; done
          echo ""
          echo "</details>"
          echo ""
          echo "<details>"
          echo "<summary>主要插件</summary>"
          echo ""
          grep -h "luci-app-" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /' || true
          echo ""
          echo "</details>"
          echo ""
          echo "<details>"
          echo "<summary>固件下载 · 点击大小直接下载（国内加速）</summary>"
          echo ""
          echo "> 蓝色数字是文件大小，点它直接开始下载。"
          echo ">"
          echo "> 点击后可能需要等待几秒才开始下载，请耐心等待，不要重复点击。"
          echo ""
          MATCH=0
          ROWS=""
          for m in ${{ env.ALL_DEVICES }}; do
            line="| **${m}** "
            for t in sysupgrade.bin system.img boot.img; do
              f=$(ls ${{ env.FIRMWARE }}/*openstick-${m}-squashfs-"${t}" 2>/dev/null | head -1 || true)
              [ -n "${f}" ] || f=$(ls ${{ env.FIRMWARE }}/*openstick-${m}-*"${t}" 2>/dev/null | head -1 || true)
              if [ -n "${f}" ]; then
                MATCH=$((MATCH+1))
                n=$(basename "${f}")
                sz=$(LC_ALL=C du -h "${f}" | cut -f1)
                u="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${n}"
                line="${line}| [${sz}](${MIRROR}${u}) "
              else
                line="${line}| - "
              fi
            done
            ROWS="${ROWS}${line}|"$'\n'
          done

          if [ "${MATCH}" -eq 0 ]; then
            echo "> 固件文件名与机型未匹配，请直接在下方 Assets 列表下载。"
          else
            echo "| 机型 | sysupgrade.bin | system.img | boot.img |"
            echo "|---|---|---|---|"
            printf '%s' "${ROWS}"
          fi
          if [ -f "${{ env.FIRMWARE }}/刷机小工具-flash.zip" ]; then
            FN="刷机小工具-flash.zip"
            SZ=$(LC_ALL=C du -h "${{ env.FIRMWARE }}/${FN}" | cut -f1)
            U="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${FN}"
            echo ""
            echo "> 刷机小工具：[\`${FN}\`](${MIRROR}${U})（${SZ}）"
          fi
          echo ""
          echo "原始地址见下方 Assets 列表。"
          echo ""
          echo "</details>"
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Drop stale release with same tag
      if: steps.tag.outputs.status == 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ steps.tag.outputs.release_tag }}"
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "已删除同名旧 Release: $TAG"
        else
          echo "无同名旧 Release，跳过"
        fi

    - name: Generate file list
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

    - name: Keep firmware files only
      run: |
        cd ${{ env.FIRMWARE }}
        rm -f config.buildinfo feeds.buildinfo profiles.json \
              sha256sums version.buildinfo *.manifest
        echo "===== final files ====="
        ls -l

    - name: Upload firmware to release
      if: steps.tag.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        commit: ${{ github.sha }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/*
        allowUpdates: true
        draft: false
        prerelease: false
    - name: Cleanup old releases (keep current only)
      if: success()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SELF_TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        R="$GITHUB_REPOSITORY"
        OK=$(gh api "repos/$R/releases/tags/$SELF_TAG" \
          --jq '[.assets[]|select(.size>0)]|length' 2>/dev/null || echo 0)
        if [ -z "$SELF_TAG" ] || [ "${OK:-0}" = "0" ]; then
          echo "::warning::本次未产出有效固件(tag=${SELF_TAG:-none})，跳过清理，历史 Release 一律保留"
          exit 0
        fi
        echo "本次 Release 有效: $SELF_TAG，仅清理本项目 MSM8916-* 旧 Release"

        gh api "repos/$R/releases?per_page=100" --paginate --jq '.[].tag_name' \
        | grep -E '^MSM8916-' \
        | grep -v -x -F "$SELF_TAG" \
        | while read -r tag; do
            [ -n "$tag" ] || continue
            if gh release delete "$tag" --repo "$R" --yes --cleanup-tag; then
              echo "Deleted release + tag: $tag"
            else
              echo "::warning::release $tag delete failed"
            fi
          done

        comm -23 \
          <(gh api "repos/$R/git/refs/tags" --paginate \
              --jq '.[].ref|sub("^refs/tags/";"")' | grep -E '^MSM8916-' | sort -u) \
          <(gh api "repos/$R/releases?per_page=100" --paginate --jq '.[].tag_name' | sort -u) |
        while read -r tag; do
          [ -n "$tag" ] || continue
          gh api -X DELETE "repos/$R/git/refs/tags/$tag" >/dev/null 2>&1 \
            && echo "Deleted orphan tag: $tag"
        done
