name: Build_imm_8916

on:
  schedule:
   - cron: '0 17 * * 6'
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-msm8916
  cancel-in-progress: false

env:
  ALL_DEVICES: "jz02v10 ufi001c ufi001b ufi103s qrzl903 w001 ufi003 uz801 mf32 mf601 wf2 sp970v11 sp970v10"
  BASE_CONFIG: config/jz02v10.config
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
       contents: write
       actions: write

    steps:

    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: Initialization environment
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
        sudo find /etc/apt -maxdepth 2 -type f \( -name 'apt-mirrors.txt' -o -name '*.list' -o -name '*.sources' -o -name 'sources.list' \) -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + || true
        printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99timeout
        DEPS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        [ -n "$DEPS" ] || { echo "::error::依赖列表拉取失败"; exit 1; }
        sudo -E apt-get -y install --no-install-recommends $DEPS || {
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends $DEPS
        }

    - name: Cache mkbootimg deb
      uses: actions/cache@v5
      with:
        path: downloads/mkbootimg_34.0.5-12build1_all.deb
        key: mkbootimg-34.0.5-12build1
        restore-keys: |
          mkbootimg-

    - name: mkbootimg build
      run: |
        mkdir -p downloads
        cd downloads

        if [ ! -f mkbootimg_34.0.5-12build1_all.deb ]; then
          echo "📥 mkbootimg deb not cached, downloading..."
          wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        else
          echo "✅ mkbootimg deb restored from cache"
        fi

        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb || true
        sudo apt-get install -f -y

        mkbootimg --help || true

        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg found at: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg not found in PATH!"
        fi

        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode

    - name: Clone source code
      working-directory: /mnt
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "===== 源码最近更新 (最后 10 条) ====="
        git -C /mnt/openwrt log -10 --oneline --no-merges
        echo "===== generic 补丁目录 ====="
        ls -d /mnt/openwrt/target/linux/generic/hack-* 2>/dev/null || true

    - name: Load custom DIY_P1_SH
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

        echo "📌 Local packages feed:"
        git -C feeds/packages log -1 --format="%H %ci %s"

        echo "📌 Actual remote of feeds/packages:"
        git -C feeds/packages remote get-url origin

        echo "📌 Remote HEAD actually used:"
        git -C feeds/packages ls-remote HEAD || true

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a -f

    - name: remove warning
      run: |
        chmod 755 $GITHUB_WORKSPACE/scripts/diy-part.sh
        $GITHUB_WORKSPACE/scripts/diy-part.sh

    - name: Load custom DIY_P2_SH
      run: |
        cp $BASE_CONFIG openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: 转 multi-profile
      run: |
        cd openwrt

        sed -i '/^CONFIG_TARGET_PROFILE=/d' .config
        sed -i '/^CONFIG_TARGET_msm89xx_msm8916_DEVICE_openstick-.*=y$/d' .config
        sed -i '/^CONFIG_DEFAULT_qcom-msm8916-.*openstick-.*=y$/d' .config
        sed -i '/^CONFIG_PACKAGE_qcom-msm8916-.*openstick-.*=y$/d' .config

        if grep -q '^# CONFIG_TARGET_MULTI_PROFILE is not set' .config; then
          sed -i 's|^# CONFIG_TARGET_MULTI_PROFILE is not set|CONFIG_TARGET_MULTI_PROFILE=y|' .config
        fi
        grep -q '^CONFIG_TARGET_MULTI_PROFILE=y' .config || echo 'CONFIG_TARGET_MULTI_PROFILE=y' >> .config
        grep -q '^CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config || echo 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' >> .config

        for d in $ALL_DEVICES; do
          echo "CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-$d=y" >> .config
        done

        echo "===== 追加后设备数 ====="
        grep -c '^CONFIG_TARGET_DEVICE_msm89xx_msm8916_DEVICE_openstick-' .config

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: make defconfig
      run: |
        cd openwrt
        make defconfig V=s

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: /mnt/openwrt/.ccache
        key: ccache-msm8916-${{ github.run_id }}
        restore-keys: |
          ccache-msm8916-

    - name: Setup ccache
      run: |
       mkdir -p /mnt/openwrt/.ccache
       export CCACHE_DIR=/mnt/openwrt/.ccache
       export CCACHE_BASEDIR=/mnt/openwrt
       export CCACHE_NOHASHDIR=true
       echo "CCACHE_DIR=/mnt/openwrt/.ccache" >> "$GITHUB_ENV"
       echo "CCACHE_BASEDIR=/mnt/openwrt" >> "$GITHUB_ENV"
       echo "CCACHE_NOHASHDIR=true" >> "$GITHUB_ENV"
       ccache -M 10G
       ccache -o compression=true
       ccache -o compression_level=1
       ccache -o inode_cache=false
       ccache -o compiler_check=content
       ccache -o sloppiness=file_stat_matches,include_file_ctime,include_file_mtime,time_macros,pch_defines
       ccache -p | grep -E "max_size|cache_dir"

    - name: 查看 openwrt 目录
      run: |
        ls -la openwrt/
        ls -la openwrt/.config

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config-multi-profile
       path: |
         ${{ github.workspace }}/openwrt/.config
         ${{ github.workspace }}/openwrt/feeds.conf.default
       include-hidden-files: true

    - name: Cache dl
      id: cache-dl
      uses: actions/cache@v5
      with:
        path: openwrt/dl
        key: dl-${{ runner.os }}-immortalwrt-${{ hashFiles('openwrt/feeds.conf.default') }}
        restore-keys: |
          dl-${{ runner.os }}-immortalwrt-

    - name: Download package
      run: |
        cd openwrt
        [ "${{ steps.cache-dl.outputs.cache-hit }}" = "true" ] && echo "cache hit" || echo "cache miss"
        output=$(make download -j$(nproc) -k V=s 2>&1)
        if echo "$output" | grep -qiE "Hash verification failed|checksum mismatch|ERROR"; then
          echo "===== download errors ====="
          echo "$output" | grep -iE "Hash verification failed|checksum mismatch|ERROR"
        fi
      shell: bash

    - name: 补丁应用预检
      run: |
         cd openwrt
         bash $GITHUB_WORKSPACE/check-patches.sh

    - name: make -j$(nproc)
      id: compile
      run: |
        cd openwrt

        echo "===== ccache BEFORE ====="
        ccache --show-stats

        echo -e "$(nproc) thread compile"

        set +e
        make -j$(nproc)
        BUILD_EXIT=$?
        set -e

        if [ $BUILD_EXIT -ne 0 ]; then
          echo "⚠️ 并行编译失败，切换到详细模式..."
          set +e
          make -j8 V=s
          VERBOSE_EXIT=$?
          set -e
          [ $VERBOSE_EXIT -ne 0 ] && exit $VERBOSE_EXIT
          echo "✅ 详细模式编译成功"
        else
          echo "✅ 并行编译成功"
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_multi13" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "===== 产物清单 ====="
        ls -1 bin/targets/msm89xx/msm8916/ 2>/dev/null || true
        echo "sysupgrade 数量: $(ls -1 bin/targets/msm89xx/msm8916/*squashfs-sysupgrade.bin 2>/dev/null | wc -l)"
        echo "ccache AFTER"
        ccache --show-stats
      shell: bash

    - name: df -hT
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Prefix common
      if: steps.organize.outputs.status == 'success'
      run: |
        cd ${{ env.FIRMWARE }}
        rm -f config.buildinfo \
              feeds.buildinfo \
              profiles.json \
              sha256sums \
              version.buildinfo
      shell: bash

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Delete old workflow runs (keep newest 1)
      if: success()
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KEEP_MINIMUM_RUNS: 1
      run: |
        set -euo pipefail
        API="https://api.github.com/repos/${{ github.repository }}"
        AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28")
        KEEP=${KEEP_MINIMUM_RUNS:-1}
        SELF=${GITHUB_RUN_ID:-0}
        WF_REF="${{ github.workflow_ref }}"
        WF_PATH="${WF_REF%%@*}"
        WF_FILE="${WF_PATH##*/}"
        LIST=$(mktemp)
        trap 'rm -f "$LIST"' EXIT

        page=1
        while :; do
          BATCH=$(curl -fsS "${AUTH[@]}" \
            "$API/actions/workflows/$WF_FILE/runs?status=completed&per_page=100&page=$page")
          N=$(echo "$BATCH" | jq '.workflow_runs | length')
          [ "$N" -eq 0 ] && break
          echo "$BATCH" | jq -c --argjson self "$SELF" \
            '.workflow_runs[] | select(.id != $self) | {id, created_at, ok: (.conclusion == "success")}' >> "$LIST"
          [ "$N" -lt 100 ] && break
          page=$((page + 1))
          [ "$page" -gt 20 ] && break
        done

        DEL_IDS=$(jq -rs --argjson keep "$KEEP" \
          'sort_by(.created_at) | reverse | (map(select(.ok)) | .[:$keep] | map(.id)) as $protect | map(select(.id as $i | ($protect | index($i)) == null)) | reverse | .[].id' "$LIST")

        if [ -z "$DEL_IDS" ]; then
          echo "Nothing to delete (completed=$(wc -l < "$LIST"), keep=$KEEP)."
          exit 0
        fi

        echo "Will delete $(echo "$DEL_IDS" | wc -w) old/failed run(s), keeping newest $KEEP successful."
        for id in $DEL_IDS; do
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "${AUTH[@]}" \
            "$API/actions/runs/$id")
          case "$CODE" in
            204) echo "Deleted run $id" ;;
            404) echo "Run $id already gone" ;;
            *)   echo "::warning::run $id delete failed (HTTP $CODE)" ;;
          esac
          sleep 0.5
        done

  release:
    name: 汇总发布 Release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    if: needs.build.result == 'success' && !cancelled()
    steps:

    - name: Collect firmware artifacts
      uses: actions/download-artifact@main
      with:
        pattern: OpenWrt_firmware*
        merge-multiple: true
        path: firmware

    - name: Organize output
      run: |
        mkdir -p out
        find firmware -type f -exec mv {} out/ \;
        echo "FIRMWARE=$PWD/out" >> $GITHUB_ENV
        echo "===== files ====="
        find out -type f

    - name: Generate release tag
      id: tag
      run: |
        echo "release_tag=MSM8916-$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=MSM8916-$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        touch release.txt
        echo "" >> release.txt
        {
        echo "## 高通8916系列 immortalwrt" >> release.txt
        echo "- 编译时间: $(date +"%Y%m%d %H:%M:%S")" >> release.txt
        echo "- 编译机型: ${{ env.ALL_DEVICES }}" >> release.txt
        echo "- 管理地址: 192.168.10.1" >> release.txt
        echo "- 默认用户: root" >> release.txt
        echo "- 默认密码: 空" >> release.txt
        echo "- 源码仓库: ${{ env.REPO_URL }}" >> release.txt
        echo "- 分支: ${{ env.REPO_BRANCH }}" >> release.txt
        echo "- 内核版本: $(grep -h "kmod-usb-core" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F' - ' '{print $2}' | grep -oP '[0-9]+\.[0-9]+(\.[0-9]+)?([-~]?rc[0-9]+)?' | head -1)"
        echo "" >> release.txt
        echo "### 主要插件"
        echo "#### luci-app 系列"
        grep -h "luci-app-" ${{ env.FIRMWARE }}/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /'
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate file list
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

    - name: Keep firmware files only
      run: |
        cd ${{ env.FIRMWARE }}
        rm -f config.buildinfo feeds.buildinfo profiles.json \
              sha256sums version.buildinfo *.manifest
        echo "===== final files ====="
        ls -l

    - name: Upload firmware to release
      if: steps.tag.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/*
        allowUpdates: true
        draft: false
        prerelease: false
    - name: Cleanup old MSM8916 releases (keep newest valid)
      if: always()
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        KEEP_RELEASES: 1
        THIS_TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        set -euo pipefail
        KEEP=${KEEP_RELEASES:-1}
        LIST=$(mktemp)
        trap 'rm -f "$LIST"' EXIT

        THIS_OK=$(gh api "repos/${{ github.repository }}/releases/tags/${THIS_TAG:-}" \
          --jq '[.assets[] | select((.size // 0) > 0)] | length' 2>/dev/null || echo 0)
        if [ -z "${THIS_TAG:-}" ] || [ -z "$THIS_OK" ] || [ "$THIS_OK" = "0" ]; then
          echo "::warning::本次未产出有效固件(tag=${THIS_TAG:-none}, assets=${THIS_OK:-0})，跳过清理，历史 Release 一律保留"
          exit 0
        fi
        echo "本次 Release 有效: $THIS_TAG (非空 asset=$THIS_OK)"

        page=1
        while :; do
          BATCH=$(gh api "repos/${{ github.repository }}/releases?per_page=100&page=$page")
          N=$(echo "$BATCH" | jq 'length')
          [ "$N" -eq 0 ] && break
          echo "$BATCH" | jq -c \
            '.[] | select(.tag_name | startswith("MSM8916-")) | {tag: .tag_name, created: .created_at, ok: ([.assets[] | select((.size // 0) > 0)] | length > 0)}' \
            >> "$LIST"
          [ "$N" -lt 100 ] && break
          page=$((page + 1))
          [ "$page" -gt 20 ] && break
        done

        PROTECT=$(jq -rs --argjson keep "$KEEP" \
          'sort_by(.created) | reverse | map(select(.ok)) | .[:$keep] | .[].tag' "$LIST")
        echo "Protecting newest $KEEP valid release(s): ${PROTECT:-none}"

        OLD=$(jq -rs --argjson keep "$KEEP" \
          'sort_by(.created) | reverse | (map(select(.ok)) | .[:$keep] | map(.tag)) as $protect | map(select(.tag as $t | ($protect | index($t)) == null)) | reverse | .[].tag' "$LIST")

        if [ -z "$OLD" ]; then
          echo "No old/invalid releases to delete (matched=$(wc -l < "$LIST"), keep=$KEEP)."
          exit 0
        fi

        echo "Will delete $(echo "$OLD" | wc -w) old/invalid release(s), keeping newest $KEEP valid."
        for tag in $OLD; do
          if gh release delete "$tag" -y --cleanup-tag >/dev/null 2>&1; then
            echo "Deleted release + tag: $tag"
          else
            echo "::warning::failed to delete release $tag"
          fi
        done
        TAGS=$(mktemp)
        RELS=$(mktemp)
        trap 'rm -f "$LIST" "$TAGS" "$RELS"' EXIT

        page=1
        while :; do
          BATCH=$(gh api "repos/${{ github.repository }}/releases?per_page=100&page=$page")
          N=$(echo "$BATCH" | jq 'length')
          [ "$N" -eq 0 ] && break
          echo "$BATCH" | jq -r '.[].tag_name | select(startswith("MSM8916-"))' >> "$RELS"
          [ "$N" -lt 100 ] && break
          page=$((page + 1))
          [ "$page" -gt 20 ] && break
        done
        sort -u -o "$RELS" "$RELS"

        page=1
        while :; do
          BATCH=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/MSM8916-?per_page=100&page=$page")
          N=$(echo "$BATCH" | jq 'length')
          [ "$N" -eq 0 ] && break
          echo "$BATCH" | jq -r \
            '.[].ref | sub("^refs/tags/"; "") | select(test("^MSM8916-[A-Za-z0-9._-]+$"))' \
            >> "$TAGS"
          [ "$N" -lt 100 ] && break
          page=$((page + 1))
          [ "$page" -gt 20 ] && break
        done
        sort -u -o "$TAGS" "$TAGS"

        ORPHAN=$(comm -23 "$TAGS" "$RELS")
        if [ -z "$ORPHAN" ]; then
          echo "No orphan MSM8916 tags to clean."
        else
          echo "Will delete $(echo "$ORPHAN" | wc -w) orphan tag(s)."
          for tag in $ORPHAN; do
            if gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" >/dev/null 2>&1; then
              echo "Deleted orphan tag: $tag"
            else
              echo "::warning::failed to delete orphan tag $tag"
            fi
            sleep 0.2
          done
        fi
