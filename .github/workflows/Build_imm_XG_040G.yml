name: Build_imm_XG_040G

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean

env:
  FEEDS_CONF: feeds.conf.default
  DIY_P4_SH: diy-part4.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  ALL_DEVICES: "nokia_xg-040g-md nokia_xg-040g-md-ubi"
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: space usage check
      run: df -H

    - name: Initialization environment
      id: init
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
        sudo find /etc/apt -maxdepth 2 -type f \( -name 'apt-mirrors.txt' -o -name '*.list' -o -name '*.sources' -o -name 'sources.list' \) -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + || true
        printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99timeout
        DEPS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        [ -n "$DEPS" ] || { echo "::error::依赖列表拉取失败"; exit 1; }
        sudo -E apt-get -y install --no-install-recommends $DEPS || {
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends $DEPS
        }
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: mkbootimg build
      run: |
        DEB="$GITHUB_WORKSPACE/scripts/mkbootimg_34.0.5-12build1_all.deb"
        if [ -f "$DEB" ]; then
          sudo dpkg -i "$DEB"
          sudo apt-get install -f -y
          mkbootimg --help || true
        else
          echo "::warning::$DEB 不存在，跳过 mkbootimg"
        fi
        sudo timedatectl set-timezone "${TZ}"
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode

    - name: Clone source code
      id: codes
      if: steps.init.outputs.status == 'success' && success()
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        git pull origin "$REPO_BRANCH"
        git log --oneline -1
        cd ..
        if [ -n "$GITHUB_OUTPUT" ]; then
        echo "status=success" >> "$GITHUB_OUTPUT"
        else
        echo "::set-output name=status::success"
        fi

    - name: Free up disk space
      run: |
        sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir}
        sudo chown -R $USER:$GROUPS /mnt/openwrt
        ln -sfn /mnt/openwrt/dl openwrt/dl
        ln -sfn /mnt/openwrt/staging_dir openwrt/staging_dir
        ln -sfn /mnt/openwrt/build_dir openwrt/build_dir
        df -H

    - name: DIY_P4
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P4_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P4_SH

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: Prepare configs
      run: |
        mkdir -p configs
        BAD=""
        for D in $ALL_DEVICES; do
          (
            set -e
            cp -f config/nokia_xg-040g-md.config openwrt/.config
            cd openwrt
            sed -i '/CONFIG_TARGET_PROFILE/d' .config
            sed -i '/CONFIG_TARGET_airoha_an7581_DEVICE/d' .config
            printf '%s\n' \
              'CONFIG_TARGET_airoha=y' \
              'CONFIG_TARGET_airoha_an7581=y' \
              "CONFIG_TARGET_PROFILE=\"DEVICE_$D\"" \
              "CONFIG_TARGET_airoha_an7581_DEVICE_$D=y" >> .config
            make defconfig
            grep -qx "CONFIG_TARGET_PROFILE=\"DEVICE_$D\"" .config || { echo "::error::$D 无对应 Device，defconfig 实际选中 $(grep '^CONFIG_TARGET_PROFILE' .config)"; exit 1; }
            cp .config "$GITHUB_WORKSPACE/configs/$D.config"
          ) || BAD="$BAD $D"
        done
        [ -z "$BAD" ] || { echo "::error::配置生成失败:$BAD"; exit 1; }

    - name: Upload build config
      uses: actions/upload-artifact@main
      if: always() && !cancelled()
      with:
        name: build-config
        path: |
          configs/*
          openwrt/feeds.conf.default
        include-hidden-files: true

    - name: Build all devices
      id: compile
      run: |
        mkdir -p firmware meta
        : > built.txt
        : > failed.txt
        for D in $ALL_DEVICES; do
          echo "::group::compile $D"
          cp -f "configs/$D.config" openwrt/.config
          rc=0
          (
            set -e
            cd openwrt
            make download -j"$(nproc)" || make download -j1
            find dl -type f -size 0 -delete
            find dl -type f -name '*.part' -delete
            rm -rf bin/targets/*/*
            if [[ "${{ inputs.log_switch }}" == "true" ]]; then
              make -j1 V=s
            elif make -j"$(nproc)"; then
              echo "Compile success"
            else
              make -j4 V=s
            fi
            TGT=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -1)
            [ -n "$TGT" ] || exit 1
            rm -rf "$TGT/packages"
            mkdir -p "$GITHUB_WORKSPACE/firmware/$D" "$GITHUB_WORKSPACE/meta"
            cat "$TGT"/*.manifest > "$GITHUB_WORKSPACE/meta/$D.manifest" 2>/dev/null || true
            find "$TGT" -maxdepth 1 -type f \
              ! -name '*.manifest' \
              ! -name '*.buildinfo' \
              ! -name 'sha256sums' \
              ! -name '*.json' \
              ! -name '*.dtb' \
              ! -name '*.txt' \
              ! -name '*.md5' \
              ! -name '*.sha256' \
              -exec cp -t "$GITHUB_WORKSPACE/firmware/$D/" {} +
            [ -n "$(ls -A "$GITHUB_WORKSPACE/firmware/$D")" ] || exit 1
          ) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "$D" >> built.txt
            echo "$D ok"
          else
            echo "::warning::$D 编译失败，跳过"
            echo "$D" >> failed.txt
            rm -rf "firmware/$D"
          fi
          df -h / | tail -1
          echo "::endgroup::"
        done
        test -s built.txt || { echo "::error::所有机型编译失败"; exit 1; }
        echo "FILE_DATE=_$(date +%Y%m%d)" >> $GITHUB_ENV
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.FILE_DATE }}
        path: firmware/**/*

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +%Y.%m.%d)-V${{ github.run_number }}" >> $GITHUB_OUTPUT
        echo "release_name=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_OUTPUT
        echo "🚀 ImmortalWrt firmware (贝尔光猫)" >> release.txt
        echo "----------------------" >> release.txt
        echo "设备型号:" >> release.txt
        while read -r x; do echo "  - $x" >> release.txt; done < built.txt
        if [ -s failed.txt ]; then
          echo "本次编译失败: $(tr '\n' ' ' < failed.txt)" >> release.txt
        fi
        echo "时间: $(date +"%Y-%m-%d %H:%M")" >> release.txt
        echo "内核版本: $(grep -h "kmod-usb-core" meta/*.manifest 2>/dev/null | awk -F' - ' '{print $2}' | grep -oP '[5-6]\.[0-9]+\.[0-9]+' | head -1 || echo '未知')" >> release.txt
        echo "源码仓库: ${{ env.REPO_URL }}" >> release.txt
        echo "分支: ${{ env.REPO_BRANCH }}" >> release.txt
        echo "管理地址: 192.168.10.1" >> release.txt
        echo "默认账号: root / 无密码" >> release.txt
        echo "" >> release.txt
        echo "📌 bug反馈交流 QQ 群: 1020967055" >> release.txt
        echo "" >> release.txt
        echo "### 主要插件" >> release.txt
        echo "#### luci-app 系列" >> release.txt
        grep -h "luci-app-" meta/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u | sed 's/^/- /' >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate file list
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success'
      run: |
        find firmware -type f > file_list.txt
        echo "Collected files:"
        cat file_list.txt
        test -s file_list.txt || { echo "::error::No firmware files found"; exit 1; }

    - name: Upload firmware to release
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success'
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: ${{ steps.tag.outputs.release_name }}
        bodyFile: release.txt
        artifacts: firmware/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
