name: Build_uboot_verify（原样 vs 关闭原生启动，双份对照）

# 背景（本地二进制比对已确认，勿再改回旧结论）：
#   - 你的 uboot 1310720 (0x140000)，尾部 743292 字节 FF，有效载荷 567428
#   - 对方 uboot 567428，无尾部 FF，有效载荷同为 567428
#   => 大小差异只是 FF 填充：j佬 envelope.py 原生补 FF 到 0x140000，你的正常，不是编译问题。
#   - 两份用同一份原厂 SML donor：signed 载荷 53072B、descriptor、证书载荷hash 全相同。
#     证书尾部签名不同只是 code 不同->body hash 不同->再用同一私钥重签的必然结果，非 donor 不同。
#   - 唯一实质差异 = code 区 23 字节（sy108_boot_early / 原生启动），
#     正是它连锁导致 body hash / header hash / 证书签名全部不同。
#
# 本 workflow 同时编两份做对照：
#   1) original —— j佬原样源码
#   2) noboot   —— 只注释 CONFIG_SY108_NATIVE_BOOT
# 真机分别刷入，即可判定「响一声没动静」是否由原生启动那段代码导致。

on:
  workflow_dispatch:
    inputs:
      model:
        description: '要比对的机型（m50rs 是之前刷机那台）'
        required: true
        default: 'm50rs'
        type: choice
        options:
          - m50rs
          - m50p
          - p50pro
          - all

env:
  UBOOT_REPO: https://github.com/jason-liu-4980/sy108-uboot-spl
  TZ: Asia/Shanghai

permissions:
  contents: write

concurrency:
  group: uboot-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uboot:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
    - name: Checkout（取 sy108-oem/ 原厂输入与 capsule）
      uses: actions/checkout@main

    - name: Clone j佬源码（同时准备 original / noboot 两份）
      run: |
        set -e
        git clone --depth 1 --no-single-branch "$UBOOT_REPO" uboot-src
        # offline 的 build.sh 要 git rev-parse oem 做 chipram 校验，本地要有 oem 分支
        git -C uboot-src checkout -B oem origin/oem
        git -C uboot-src checkout main
        echo "SOURCE_COMMIT=$(git -C uboot-src rev-parse HEAD)" | tee -a "$GITHUB_ENV"

        # original：保持 j佬 main 原样，不动
        # noboot：复制一份源码树，只注释原生启动宏
        rm -rf uboot-noboot
        cp -a uboot-src uboot-noboot
        CFG=uboot-noboot/src/u-boot/include/configs/udx710_4h10_recon.h
        echo "--- noboot 修改前 ---"
        grep -n "CONFIG_SY108_NATIVE_BOOT" "$CFG"
        sed -i 's|^#define CONFIG_SY108_NATIVE_BOOT$|// #define CONFIG_SY108_NATIVE_BOOT (disabled for verify)|' "$CFG"
        echo "--- noboot 修改后 ---"
        grep -n "NATIVE_BOOT" "$CFG"
        if grep -q '^#define CONFIG_SY108_NATIVE_BOOT$' "$CFG"; then
          echo "::error::NATIVE_BOOT 未成功关闭"; exit 1
        fi

    - name: 前置校验 capsule（main=target2 / recovery=target1）
      run: |
        python3 - <<'PY'
        import struct
        for f, want in [
            ('sy108-oem/immortalwrt-sprd-udx710-sy108-kernel.bin', 2),
            ('sy108-oem/recovery-boot.bin', 1),
        ]:
            d = open(f, 'rb').read(2752)
            assert d[:8] == b'DHTB\x01\x00\x00\x00' and d[512:520] == b'ANDROID!', f'{f}: 非合法 capsule'
            t = struct.unpack_from('<I', d, 2560 + 128 + 8)[0]
            assert t == want, f'{f}: boot-target={t}, 期望 {want}'
            print(f'{f}: target={t} OK')
        PY

    - name: make offline（original / noboot 各编一遍）
      run: |
        set -e
        M="${{ inputs.model }}"
        if [ "$M" = all ]; then MODELS="m50rs m50p p50pro"; else MODELS="$M"; fi
        MAIN="$PWD/sy108-oem/immortalwrt-sprd-udx710-sy108-kernel.bin"
        REC="$PWD/sy108-oem/recovery-boot.bin"
        for m in $MODELS; do
          d="$PWD/sy108-oem/$m"
          for variant in original noboot; do
            case "$variant" in
              original) SRCDIR="uboot-src";    LABEL="orig-$m";   IMG="udx710-boot:orig" ;;
              noboot)   SRCDIR="uboot-noboot"; LABEL="noboot-$m"; IMG="udx710-boot:noboot" ;;
            esac
            echo "===== make offline [$variant] $m ====="
            make -C "$SRCDIR" offline LABEL="$LABEL" BOOT_IMAGE="$IMG" \
              SPL_IMAGE="$d/splloader.bin" \
              SML_IMAGE="$d/sml.bin" \
              MAIN_CAPSULE="$MAIN" \
              RECOVERY_CAPSULE="$REC"
          done
        done

    - name: 分析两份产物并生成对照报告
      run: |
        set -e
        mkdir -p verify-out
        M="${{ inputs.model }}"
        if [ "$M" = all ]; then MODELS="m50rs m50p p50pro"; else MODELS="$M"; fi
        : > uboot-rows.md
        for m in $MODELS; do
          for variant in original noboot; do
            case "$variant" in
              original) LABEL="orig-$m";   NAME="uboot-$m-original.bin" ;;
              noboot)   LABEL="noboot-$m"; NAME="uboot-$m-noboot.bin" ;;
            esac
            src="uboot-src/build/$LABEL/uboot.bin"
            [ "$variant" = noboot ] && src="uboot-noboot/build/$LABEL/uboot.bin"
            [ -s "$src" ] || { echo "::error::$variant $m 未产出 uboot.bin"; exit 1; }
            cp "$src" "verify-out/$NAME"
            python3 - "$m" "$variant" "$src" "$NAME" >> uboot-rows.md <<'PY'
        import sys, hashlib
        m, variant, p, name = sys.argv[1:5]
        d = open(p, 'rb').read()
        n = len(d)
        while n > 0 and d[n-1] == 0xFF:
            n -= 1
        ff = len(d) - n
        bodyhash = d[8:40].hex()
        print(f'| `{m}` | `{variant}` | `{n}` | `{ff}` | `{len(d)}` | `{bodyhash[:16]}…` | `{name}` |')
        if n != 567428:
            print(f'::warning::{variant} {m} 有效长度 {n} != 567428，需复核')
        PY
          done
        done
        {
          echo "## uboot 双份对照（original vs 关闭原生启动）"
          echo ""
          echo "> 唯一实质差异：code 区 23 字节 \`sy108_boot_early\` / 原生启动。两版其余（SML donor、签名载荷、证书载荷hash）完全一致。"
          echo "> 有效载荷应为 **567428**，总 1310720 (FF 743292)——与已验证能用的那份等长；大小不是问题。"
          echo "> **请分别刷 \`uboot-<机型>-original.bin\` 和 \`uboot-<机型>-noboot.bin\`**：哪个能进 recovery / USB 出网卡+串口，就锁定根因。"
          echo "> 刷机务必保留 \`ubootbak\`，起不来可救回。"
          echo ""
          echo "SOURCE_COMMIT: $SOURCE_COMMIT"
          echo ""
          echo "| 机型 | 版本 | 有效载荷 | 尾部FF | 总字节 | body hash(前16) | 文件 |"
          echo "|---|---|---|---|---|---|---|"
          cat uboot-rows.md
        } > verify-release.md
        cat verify-release.md

    - name: Upload
      uses: actions/upload-artifact@main
      with:
        name: uboot-verify-dual
        path: verify-out/*
        if-no-files-found: error

    - name: 发布到 Release
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: uboot 双份对照（原样 vs 关原生启动）
        tag: uboot-verify-dual-${{ github.run_number }}
        bodyFile: verify-release.md
        artifacts: verify-out/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        makeLatest: false
        draft: false
        prerelease: true
