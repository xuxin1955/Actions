name: Build_imm_HLK_7628D_N

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      log_switch:
        description: " ← 单线程编译 默认4线程"
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: false

    - name: space usage check
      run: |
        df -H

    - name: Initialization environment
      id: init
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        DEPS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)
        sudo -E apt-get -y install --no-install-recommends $DEPS
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: mkbootimg build
      run: |
        DEB="$GITHUB_WORKSPACE/scripts/mkbootimg_34.0.5-12build1_all.deb"
        if [ -f "$DEB" ]; then
          sudo dpkg -i "$DEB"
          sudo apt-get install -f -y
          mkbootimg --help || true
        else
          echo "::warning::$DEB 不存在，跳过 mkbootimg"
        fi
        sudo timedatectl set-timezone "${TZ}"

    - name: Ensure Python build tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install Unidecode

    - name: Clone source code
      id: codes
      if: steps.init.outputs.status == 'success' && success()
      run: |
        git clone "$REPO_URL" -b "$REPO_BRANCH" openwrt
        cd openwrt
        git pull origin "$REPO_BRANCH"
        git log --oneline -1
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Free up disk space
      run: |
        sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir}
        sudo chown -R $USER:$GROUPS /mnt/openwrt
        ln -sfn /mnt/openwrt/dl openwrt/dl
        ln -sfn /mnt/openwrt/staging_dir openwrt/staging_dir
        ln -sfn /mnt/openwrt/build_dir openwrt/build_dir
        df -H

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: Build and release
      id: build
      env:
        MIRROR: https://gh-proxy.com/
      run: |
        TAG="HLK-7628-$(date +"%Y.%m.%d-%H%M")"
        MIRROR="${MIRROR:-https://gh-proxy.com/}"
        build_fw() {
          local PFX="$1" CFG="$2" DIY="$3" LABEL="$4"
          cd "$GITHUB_WORKSPACE/openwrt"
          git reset --hard HEAD >/dev/null
          git clean -fdx >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/openwrt/{dl,staging_dir,build_dir}
          sudo chown -R "$USER:$GROUPS" /mnt/openwrt
          ln -sfn /mnt/openwrt/dl dl
          ln -sfn /mnt/openwrt/staging_dir staging_dir
          ln -sfn /mnt/openwrt/build_dir build_dir
          cd "$GITHUB_WORKSPACE"
          [ -e "$FEEDS_CONF" ] && cp -f "$FEEDS_CONF" openwrt/feeds.conf.default
          chmod +x "$DIY"
          ( cd openwrt && "$GITHUB_WORKSPACE/$DIY" )
          ( cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a -f )
          cp -fv "$CFG" openwrt/.config
          ( cd openwrt && make defconfig )
          ( cd openwrt && make download -j8 && find dl -size -1024c -delete )
          ( cd openwrt && ( make -j$(nproc) || make -j4 V=s ) )
          local FWDIR="$GITHUB_WORKSPACE/openwrt/bin/targets/ramips/mt76x8"
          local OUT="$GITHUB_WORKSPACE/out-$PFX"
          mkdir -p "$OUT"
          cp -f "$FWDIR"/*.bin "$OUT"/ 2>/dev/null || true
          cp -f "$FWDIR"/*.manifest "$OUT"/ 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/configs"
          cp -f openwrt/.config "$GITHUB_WORKSPACE/configs/$PFX.config"
          cp -f openwrt/feeds.conf.default "$GITHUB_WORKSPACE/configs/$PFX.feeds.conf.default"
          echo "fw_$PFX=$OUT" >> "$GITHUB_OUTPUT"
          echo "$LABEL" >> models.txt
          grep -h "luci-app-" "$OUT"/*.manifest 2>/dev/null | awk -F':' '{print $NF}' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -oP 'luci-app-[a-zA-Z0-9_-]+' | sort -u >> plugins.txt
          local f n sz u
          for f in "$OUT"/*.bin; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            sz=$(du -h "$f" | cut -f1)
            u="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${n}"
            echo "| **${LABEL}** | ${n} | [${sz}](${MIRROR}${u}) |" >> rows.txt
          done
          rm -f "$OUT"/*.manifest
        }
        : > models.txt
        : > plugins.txt
        : > rows.txt
        build_fw 7628D config/hlk7628d.config diy-part6.sh "HILINK HLK-7628DNA WIFI路由模块"
        build_fw 7628N config/hlk7628n.config diy-part3.sh "HILINK HLK-7628N WIFI路由模块"
        echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
        {
          echo "## HLK-7628D / HLK-7628N OpenWrt 固件"
          echo ""
          echo "- 编译时间: $(date +"%Y-%m-%d %H:%M")"
          echo "- 管理地址: 192.168.10.1"
          echo "- 默认账号: root / 空密码"
          echo "- 源码: ${REPO_URL}"
          echo "- 分支: ${REPO_BRANCH}"
          echo ""
          echo "<details>"
          echo "<summary>支持机型</summary>"
          echo ""
          sed 's/^/- /' models.txt
          echo ""
          echo "</details>"
          echo ""
          echo "<details>"
          echo "<summary>主要插件</summary>"
          echo ""
          sort -u plugins.txt | sed 's/^/- /'
          echo ""
          echo "</details>"
          echo ""
          echo "<details>"
          echo "<summary>固件下载 · 点击大小直接下载（国内加速）</summary>"
          echo ""
          echo "> 蓝色数字是文件大小，点它直接开始下载。"
          echo "> 点击后可能需要等待几秒才开始下载，请耐心等待，不要重复点击。"
          echo ""
          echo "| 机型 | 固件 | 大小 |"
          echo "|---|---|---|"
          cat rows.txt
          echo ""
          echo "原始地址见下方 Assets 列表。"
          echo ""
          echo "</details>"
        } > release.txt

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
        name: build-config
        path: ${{ github.workspace }}/configs/*
        include-hidden-files: true

    - name: Upload 7628D firmware directory
      uses: actions/upload-artifact@main
      if: steps.build.outputs.fw_7628D != '' && !cancelled()
      with:
        name: OpenWrt_firmware_7628D
        path: ${{ steps.build.outputs.fw_7628D }}/*

    - name: Upload 7628N firmware directory
      uses: actions/upload-artifact@main
      if: steps.build.outputs.fw_7628N != '' && !cancelled()
      with:
        name: OpenWrt_firmware_7628N
        path: ${{ steps.build.outputs.fw_7628N }}/*

    - name: Upload to release
      if: steps.build.outputs.release_tag != ''
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.build.outputs.release_tag }}
        name: HLK-7628D / HLK-7628N
        bodyFile: release.txt
        artifacts: ${{ steps.build.outputs.fw_7628D }}/**/*,${{ steps.build.outputs.fw_7628N }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
