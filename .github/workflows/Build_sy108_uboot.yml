name: Build_sy108_uboot

on:
  workflow_dispatch:
    inputs:
      model:
        description: ' ← 选择机型'
        required: true
        default: p50pro
        type: choice
        options:
          - p50pro
          - m50p
          - m50rs

env:
  TZ: Asia/Shanghai
  SPL_FILE: splloader.bin
  SML_FILE: sml.bin
  UBOOT_REPO: https://github.com/jason-liu-4980/sy108-uboot-spl

jobs:
  uboot:
    runs-on: ubuntu-latest
    env:
      MODEL: ${{ inputs.model }}
      OEM_DIR: sy108-oem/${{ inputs.model }}
      UBOOT_TAG: uboot-${{ inputs.model }}

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Check inputs
      run: |
        for f in "$SPL_FILE" "$SML_FILE"; do
          [ -f "$OEM_DIR/$f" ] || { echo "::error::$OEM_DIR/$f missing"; exit 1; }
          echo "$OEM_DIR/$f $(stat -c%s "$OEM_DIR/$f") bytes"
        done
        python3 - "$OEM_DIR/$SPL_FILE" "$OEM_DIR/$SML_FILE" <<'PYEOF'
        import hashlib, struct, sys
        for path in sys.argv[1:]:
            data = open(path, 'rb').read()
            if len(data) < 512 or data[:8] != b'DHTB\1\0\0\0':
                raise SystemExit(path + ' is not a DHTB image')
            payload = struct.unpack_from('<I', data, 48)[0]
            fields = struct.unpack_from('<8sII10Q', data, 512 + payload)
            size, offset, cert_size, cert_offset = fields[3:7]
            body = data[offset:offset + size]
            cert = data[cert_offset:cert_offset + cert_size]
            ok = hashlib.sha256(body).digest() == cert[268:300]
            print('%-40s size=%d payload=%d cert=%d match=%s'
                  % (path, len(data), size, cert_size, ok))
            if not ok:
                raise SystemExit(path + ': payload hash does not match certificate')
        PYEOF

    - name: Download capsules
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p capsules
        TAG=$(gh release list --repo "${{ github.repository }}" --limit 30 \
          --json tagName,createdAt \
          --jq '[.[] | select(.tagName | test("^[0-9]{4}\\."))] | sort_by(.createdAt) | last | .tagName')
        echo "firmware release: $TAG"
        gh release download "$TAG" --repo "${{ github.repository }}" \
          --pattern '*-boot.bin' --dir capsules --clobber
        ls -l capsules

    - name: Build uboot
      run: |
        git clone --depth 1 "$UBOOT_REPO" uboot-src
        git -C uboot-src fetch --depth 1 origin oem:oem
        make -C uboot-src offline LABEL="$MODEL" \
          SPL_IMAGE="$PWD/$OEM_DIR/$SPL_FILE" \
          SML_IMAGE="$PWD/$OEM_DIR/$SML_FILE" \
          MAIN_CAPSULE="$PWD/capsules/main-boot.bin" \
          RECOVERY_CAPSULE="$PWD/capsules/recovery-boot.bin"
        cp "uboot-src/build/$MODEL/uboot.bin" "uboot-$MODEL.bin"
        ls -l "uboot-$MODEL.bin"

    - name: Fingerprint
      run: |
        case "$MODEL" in
          p50pro) MODEL_NAME="P50 Pro 5G 通信壳" ;;
          m50p)   MODEL_NAME="Mate50 Pro 5G 通信壳" ;;
          m50rs)  MODEL_NAME="Mate50 RS 5G 通信壳" ;;
        esac
        echo "MODEL_NAME=$MODEL_NAME" >> $GITHUB_ENV
        echo "U_SHA=$(sha256sum "uboot-$MODEL.bin" | cut -d' ' -f1)" >> $GITHUB_ENV
        echo "SML_SHA=$(sha256sum "$OEM_DIR/$SML_FILE" | cut -d' ' -f1)" >> $GITHUB_ENV
        echo "SPL_SHA=$(sha256sum "$OEM_DIR/$SPL_FILE" | cut -d' ' -f1)" >> $GITHUB_ENV

    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: SY108_uboot_${{ inputs.model }}
        path: |
          uboot-${{ inputs.model }}.bin
          uboot-src/build/${{ inputs.model }}/offline-report.json

    - name: Publish uboot
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: U-Boot ${{ env.MODEL_NAME }}
        tag: ${{ env.UBOOT_TAG }}
        body: |
          **支持机型**：P50 Pro / Mate50 Pro / Mate50 RS

          **文件**：`uboot-${{ inputs.model }}.bin` → 写 `uboot` 分区（1280 KiB）

          ```
          uboot sha256: ${{ env.U_SHA }}
          sml   sha256: ${{ env.SML_SHA }}
          ```

          **建议**：优先用自己设备提取的 `splloader`、`sml` 放进 `sy108-oem/<机型>/` 重新编译。
        artifacts: uboot-${{ inputs.model }}.bin
        artifactErrorsFailBuild: false
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: false
        draft: false
        prerelease: true
