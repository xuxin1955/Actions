name: Build_sy108_uboot

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  SPL_FILE: splloader.bin
  SML_FILE: sml.bin
  MODELS: p50pro m50p m50rs
  UBOOT_REPO: https://github.com/jason-liu-4980/sy108-uboot-spl
  UBOOT_IMAGE: udx710-boot:build

jobs:
  uboot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Check inputs
      id: pick
      run: |
        base=""
        for m in $MODELS; do
          dir="sy108-oem/$m"
          if [ ! -f "$dir/$SPL_FILE" ] || [ ! -f "$dir/$SML_FILE" ]; then
            echo "::warning::$m skipped: $dir missing $SPL_FILE or $SML_FILE"
            continue
          fi
          [ -n "$base" ] || base=$m
          echo "== $m"
          python3 - "$dir/$SPL_FILE" "$dir/$SML_FILE" <<'PYEOF'
        import hashlib, struct, sys
        for path in sys.argv[1:]:
            data = open(path, 'rb').read()
            if len(data) < 512 or data[:8] != b'DHTB\1\0\0\0':
                raise SystemExit(path + ' is not a DHTB image')
            payload = struct.unpack_from('<I', data, 48)[0]
            fields = struct.unpack_from('<8sII10Q', data, 512 + payload)
            size, offset, cert_size, cert_offset = fields[3:7]
            body = data[offset:offset + size]
            cert = data[cert_offset:cert_offset + cert_size]
            ok = hashlib.sha256(body).digest() == cert[268:300]
            print('   %-16s size=%d payload=%d match=%s'
                  % (path.split('/')[-1], len(data), size, ok))
            if not ok:
                raise SystemExit(path + ': payload hash does not match certificate')
        PYEOF
        done
        [ -n "$base" ] || { echo "::error::no model directory has $SPL_FILE/$SML_FILE"; exit 1; }
        echo "base=$base" >> $GITHUB_OUTPUT
        echo "base model: $base"

    - name: Download capsules
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p capsules
        TAG=$(gh release list --repo "${{ github.repository }}" --limit 30 \
          --json tagName,createdAt \
          --jq '[.[] | select(.tagName | test("^[0-9]{4}\\."))] | sort_by(.createdAt) | last | .tagName')
        echo "firmware release: $TAG"
        gh release download "$TAG" --repo "${{ github.repository }}" \
          --pattern '*-boot.bin' --dir capsules --clobber
        ls -l capsules

    - name: Clone uboot source
      run: |
        git clone --depth 1 "$UBOOT_REPO" uboot-src
        git -C uboot-src fetch --depth 1 origin oem:oem

    - name: Build uboot once
      run: |
        b="${{ steps.pick.outputs.base }}"
        make -C uboot-src offline LABEL=base \
          SPL_IMAGE="$PWD/sy108-oem/$b/$SPL_FILE" \
          SML_IMAGE="$PWD/sy108-oem/$b/$SML_FILE" \
          MAIN_CAPSULE="$PWD/capsules/main-boot.bin" \
          RECOVERY_CAPSULE="$PWD/capsules/recovery-boot.bin"
        ls -l uboot-src/build/base/uboot/u-boot-dtb.bin uboot-src/build/base/spl-check

    - name: Package and publish per model
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        failed=0
        for m in $MODELS; do
          dir="sy108-oem/$m"
          [ -f "$dir/$SPL_FILE" ] && [ -f "$dir/$SML_FILE" ] || continue
          echo "== $m"
          mkdir -p "out-$m"
          if ! docker run --rm --platform linux/amd64 --network none \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/$dir:/inputs:ro" \
              -v "$PWD/uboot-src/build/base:/base:ro" \
              -v "$PWD/out-$m:/out" \
              --entrypoint /bin/sh "$UBOOT_IMAGE" -c '
                set -e
                python3 /opt/boot/envelope.py /base/uboot/u-boot-dtb.bin \
                  /inputs/sml.bin /out/uboot.bin
                qemu-aarch64 /base/spl-check /inputs/spl.bin /out/uboot.bin \
                  0xc0000 0 /inputs/sml.bin
              '; then
            echo "::error::$m package failed"
            failed=1
            continue
          fi
          cp "out-$m/uboot.bin" "uboot-$m.bin"
          usha=$(sha256sum "uboot-$m.bin" | cut -d' ' -f1)
          ssha=$(sha256sum "$dir/$SML_FILE" | cut -d' ' -f1)
          case "$m" in
            p50pro) title="P50 Pro 5G 通信壳" ;;
            m50p)   title="Mate50 Pro 5G 通信壳" ;;
            m50rs)  title="Mate50 RS 5G 通信壳" ;;
          esac
          {
            echo "**支持机型**：P50 Pro / Mate50 Pro / Mate50 RS"
            echo
            echo "**文件**：\`uboot-$m.bin\` → 写 \`uboot\` 分区（1280 KiB）"
            echo
            echo "uboot sha256: $usha"
            echo "sml   sha256: $ssha"
            echo
            echo "**建议**：优先用自己设备提取的 \`splloader\`、\`sml\` 放进 \`sy108-oem/<机型>/\` 重新编译。"
          } > "notes-$m.md"
          gh release view "uboot-$m" >/dev/null 2>&1 \
            || gh release create "uboot-$m" --title "U-Boot $title" \
                 --notes-file "notes-$m.md" --prerelease --latest=false
          gh release edit "uboot-$m" --title "U-Boot $title" --notes-file "notes-$m.md"
          gh release upload "uboot-$m" "uboot-$m.bin" --clobber
          ls -l "uboot-$m.bin"
        done
        [ "$failed" = 0 ]

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: SY108_uboot
        path: |
          uboot-*.bin
          uboot-src/build/base/offline-report.json
        if-no-files-found: warn
