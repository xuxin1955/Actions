name: Build_sy108_UDX710

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/jason-liu-4980/sy108-mainline
  REPO_BRANCH: main
  JOBS: 4
  DIY_SY108_SH: diy-sy108.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  SY108_OUT: ${{ github.workspace }}/out
  SY108_DOWNLOADS: ${{ github.workspace }}/dl

concurrency:
  group: sy108-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: space usage check
      run: |
        df -H

    - name: Initialization environment
      id: init
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
        sudo find /etc/apt -maxdepth 2 -type f \( -name 'apt-mirrors.txt' -o -name '*.list' -o -name '*.sources' -o -name 'sources.list' \) -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + || true
        printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99timeout
        PKGS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt | tr ' ' '\n' | grep -vE '^(gcc-multilib|g\+\+-multilib|libc6-dev-i386)$' | tr '\n' ' ')
        [ -n "$PKGS" ] || { echo "::error::依赖列表拉取失败"; exit 1; }
        sudo -E apt-get -y install --no-install-recommends $PKGS || {
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends $PKGS
        }
        sudo timedatectl set-timezone "${TZ}"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Clone source code
      id: codes
      if: steps.init.outputs.status == 'success' && success()
      run: |
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" sy108
        cd sy108
        git log --oneline -1
        echo "SY108_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        cd ..
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Patch build scripts for CI
      working-directory: ./sy108
      run: |
        cat "$GITHUB_WORKSPACE/scripts/sy108/workspace_overlay.py" >> tools/lib/workspace.py
        PROBE=$(./tools/python -c "import sys; sys.path.insert(0,'tools/lib'); from workspace import container; print(container(['echo','hi'])[0])")
        test "$PROBE" = "echo" || { echo "::error::container() override not applied, got: $PROBE"; exit 1; }

        sed -i 's|raise SystemExit("Linux archive checksum mismatch")|print(f"::warning::kernel archive sha256={digest}, manifest mismatch ignored")|' tools/build/kernel-source.py
        sed -i "s/'V=s'/'V=' + __import__('os').environ.get('V','0')/g" tools/build/firmware.py
        grep -n "'V='" tools/build/firmware.py

    - name: Map build paths
      run: |
        mkdir -p "$SY108_OUT" "$SY108_DOWNLOADS"
        sudo ln -sfn "$GITHUB_WORKSPACE/sy108" /project
        sudo ln -sfn "$SY108_OUT" /output
        sudo ln -sfn "$SY108_DOWNLOADS" /downloads
        ls -ld /project /output /downloads

    - name: Update & Install feeds (bootstrap)
      working-directory: ./sy108
      run: |
        ./tools/python tools/bootstrap.py --skip-container
        git -C "$SY108_OUT/openwrt-build" log --oneline -1

    - name: Load custom DIY_SY108_SH
      run: |
        [ -f "$DIY_SY108_SH" ] || exit 0
        chmod +x "$DIY_SY108_SH"
        cd "$SY108_OUT/openwrt-build"
        $GITHUB_WORKSPACE/$DIY_SY108_SH

    - name: Restore package cache
      id: dcache
      uses: actions/cache/restore@v5.1.0
      with:
        path: |
          out/openwrt-build/dl
          dl
        key: sy108-dl-${{ hashFiles('sy108/manifests/*.json') }}
        restore-keys: |
          sy108-dl-

    - name: Download package
      working-directory: ./sy108
      run: |
        mkdir -p "$SY108_OUT/config"
        for P in main recovery; do
          ./tools/python tools/build/firmware.py "$P" --configure-only
          cp "$SY108_OUT/openwrt-build/.config" "$SY108_OUT/config/$P.config"
          cp "$SY108_OUT/openwrt-build/feeds.conf" "$SY108_OUT/config/$P.feeds.conf"
          KARC=$(jq -r .archive manifests/kernel.json)
          ( cd "$SY108_OUT/openwrt-build" && make download -j8 LINUX_SOURCE="$KARC" LINUX_SITE=file:///downloads )
        done
        find "$SY108_OUT/openwrt-build/dl" -size -1024c -delete

    - name: Save package cache
      continue-on-error: true
      if: steps.dcache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.1.0
      with:
        path: |
          out/openwrt-build/dl
          dl
        key: ${{ steps.dcache.outputs.cache-primary-key }}

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ env.SY108_OUT }}/config/main.config
         ${{ env.SY108_OUT }}/config/recovery.config
         ${{ env.SY108_OUT }}/config/main.feeds.conf
         ${{ env.SY108_OUT }}/config/recovery.feeds.conf
       include-hidden-files: true

    - name: Compile the SY108 firmware
      id: compile
      working-directory: ./sy108
      run: |
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        rc=0
        for P in main recovery; do
          echo "::group::compile $P"
          ok=1
          if ! ./tools/python tools/build/firmware.py "$P" --jobs "$JOBS"; then
            echo "$P failed, retry with -j2 V=s"
            V=s ./tools/python tools/build/firmware.py "$P" --jobs 2 || ok=0
          fi
          if [ "$ok" = 1 ]; then
            echo "${P}_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "${P}_ok=false" >> "$GITHUB_OUTPUT"
            rc=1
          fi
          rm -rf "$SY108_OUT/images/$P/packages"
          echo "::endgroup::"
        done
        exit $rc

    - name: Upload main firmware
      uses: actions/upload-artifact@main
      if: always() && env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.main_ok == 'true' && !cancelled()
      with:
        name: SY108_firmware_main${{ env.FILE_DATE }}
        path: ${{ env.SY108_OUT }}/images/main/*

    - name: Upload recovery firmware
      uses: actions/upload-artifact@main
      if: always() && env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.recovery_ok == 'true' && !cancelled()
      with:
        name: SY108_firmware_recovery${{ env.FILE_DATE }}
        path: ${{ env.SY108_OUT }}/images/recovery/*

    - name: Prepare release
      id: tag
      if: always() && !cancelled()
      run: |
        TAG=$(date +"%Y.%m.%d-%H%M")
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT
        echo "release_name=SY108 华为5G通讯壳 OpenWrt 固件 (UDX710) $TAG" >> $GITHUB_OUTPUT
        mkdir -p firmware
        cp -f "$SY108_OUT/images/main/boot.bin" firmware/main-boot.bin 2>/dev/null || true
        cp -f "$SY108_OUT/images/main/sysupgrade.bin" firmware/sysupgrade.bin 2>/dev/null || true
        cp -f "$SY108_OUT/images/main/build.json" firmware/main-build.json 2>/dev/null || true
        M=$(ls "$SY108_OUT/images/main/"*.manifest 2>/dev/null | head -1)
        [ -n "$M" ] && cp -f "$M" firmware/main.manifest || true
        cp -f "$SY108_OUT/images/recovery/boot.bin" firmware/recovery-boot.bin 2>/dev/null || true
        : > release.txt
        KVER=$(jq -r '.kernel.version' firmware/main-build.json 2>/dev/null || echo unknown)
        MISS=""
        [ -f firmware/sysupgrade.bin ] || MISS="$MISS sysupgrade.bin"
        [ -f firmware/recovery-boot.bin ] || MISS="$MISS boot.bin"
        echo "> **编译整套固件，待验证**" >> release.txt
        if [ -n "$MISS" ]; then
          echo ">" >> release.txt
          echo "> 本次缺少:$MISS，该部分构建未成功，请勿按完整流程刷机。下载前先看下面 Assets 列表。" >> release.txt
        fi
        echo "" >> release.txt
        echo "- 源码: $REPO_URL" >> release.txt
        echo "- 分支: $REPO_BRANCH" >> release.txt
        echo "- 内核版本: $KVER" >> release.txt
        echo "- 管理地址: 192.168.66.1" >> release.txt
        echo "- 登录账号: root" >> release.txt
        echo "- 密码: admin" >> release.txt
        echo "" >> release.txt
        for m in firmware/*.manifest; do
          [ -f "$m" ] || continue
          P=$(basename "$m" .manifest)
          LIST=$(awk '{print $1}' "$m" \
            | sed -E 's/:.*$//; s/-[0-9][^-]*$//' \
            | grep -E '^(luci-app|udx)-' \
            | sort -u || true)
          echo "#### $P 插件" >> release.txt
          if [ -n "$LIST" ]; then
            printf '%s\n' "$LIST" | sed 's/^/- /' >> release.txt
          fi
          echo "" >> release.txt
        done
        rm -f firmware/main-build.json
        rm -f firmware/*.manifest
        ls -l firmware
        cat release.txt

    - name: Free disk for uboot
      id: disk
      if: always() && !cancelled()
      run: |
        du -sh "$SY108_OUT/openwrt-build" 2>/dev/null || true
        df -H / | awk 'NR==2{printf "释放前: 总 %s / 已用 %s / 可用 %s (%s)\n",$2,$3,$4,$5}'
        rm -rf "$SY108_OUT/openwrt-build/build_dir" \
               "$SY108_OUT/openwrt-build/staging_dir" \
               "$SY108_OUT/openwrt-build/tmp"
        df -H / | awk 'NR==2{printf "释放后: 总 %s / 已用 %s / 可用 %s (%s)\n",$2,$3,$4,$5}'
        AVAIL_MB=$(df -Pm / | awk 'NR==2{print $4}')
        echo "可用空间 ${AVAIL_MB} MiB"
        if [ "${AVAIL_MB:-0}" -lt 15360 ]; then
          echo "::warning::可用空间不足 15 GiB，跳过 U-Boot，避免 docker build 撑爆磁盘"
          echo "skip=1" >> "$GITHUB_OUTPUT"
        else
          echo "skip=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Build uboot
      id: uboot
      if: always() && !cancelled() && steps.disk.outputs.skip != '1'
      continue-on-error: true
      env:
        UBOOT_REPO: https://github.com/jason-liu-4980/sy108-uboot-spl
        UBOOT_IMAGE: udx710-boot:build
      run: |
        set +e
        MODELS="${MODELS:-p50pro m50p m50rs}"
        OUT="${GITHUB_OUTPUT:-/dev/null}"
        echo "built=0" >> "$OUT"

        base=""
        for m in $MODELS; do
          if [ -f "sy108-oem/$m/splloader.bin" ] && [ -f "sy108-oem/$m/sml.bin" ]; then
            base="$m"
            break
          fi
        done
        if [ -z "$base" ]; then
          echo "::notice::sy108-oem/ 下没有 splloader.bin + sml.bin，本次跳过 U-Boot"
          exit 0
        fi
        for f in firmware/main-boot.bin firmware/recovery-boot.bin; do
          if [ ! -f "$f" ]; then
            echo "::warning::缺少 $f，本次跳过 U-Boot"
            exit 0
          fi
        done

        if ! git clone --depth 1 "$UBOOT_REPO" uboot-src; then
          echo "::warning::拉取 sy108-uboot-spl 失败，本次跳过 U-Boot"
          exit 0
        fi
        if ! git -C uboot-src fetch --depth 1 origin oem:oem; then
          echo "::warning::拉取 oem 分支失败，本次跳过 U-Boot"
          exit 0
        fi

        if ! make -C uboot-src offline LABEL=base \
            SPL_IMAGE="$PWD/sy108-oem/$base/splloader.bin" \
            SML_IMAGE="$PWD/sy108-oem/$base/sml.bin" \
            MAIN_CAPSULE="$PWD/firmware/main-boot.bin" \
            RECOVERY_CAPSULE="$PWD/firmware/recovery-boot.bin"; then
          echo "::warning::U-Boot 编译失败，本次不发布 uboot"
          exit 0
        fi

        : > uboot-rows.md
        ok=0
        for m in $MODELS; do
          d="sy108-oem/$m"
          [ -f "$d/splloader.bin" ] && [ -f "$d/sml.bin" ] || continue
          name="uboot-$m.bin"
          status="实验"
          rm -rf "out-$m"
          mkdir -p "out-$m"
          if ! docker run --rm --platform linux/amd64 --network none \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/$d:/inputs:ro" \
              -v "$PWD/uboot-src/build/base:/base:ro" \
              -v "$PWD/out-$m:/out" \
              -v "$PWD/scripts/sy108:/scripts:ro" \
              --entrypoint /bin/sh "$UBOOT_IMAGE" \
              /scripts/verify-envelope.sh /base/uboot/u-boot-dtb.bin \
                /inputs/sml.bin /inputs/splloader.bin "/out/$name"; then
            echo "::warning::$m 封装失败，跳过"
            continue
          fi
          mv "out-$m/$name" "firmware/$name"
          echo "| \`$m\` | \`$name\` | $status | \`$(sha256sum "firmware/$name" | cut -d' ' -f1)\` |" >> uboot-rows.md
          ok=1
        done

        if [ "$ok" = 1 ]; then
          {
            [ -z "$(tail -n1 release.txt 2>/dev/null)" ] || echo ""
            echo "### U-Boot 文件"
            echo ""
            echo "| 机型 | 文件 | 状态 | sha256 |"
            echo "|---|---|---|---|"
            cat uboot-rows.md
          } >> release.txt
          echo "built=1" >> "$OUT"
        fi

        cat uboot-rows.md 2>/dev/null || true
        exit 0

    - name: Trim release files
      if: always() && !cancelled()
      run: |
        [ -d firmware ] || exit 0
        cd firmware
        rm -f main-boot.bin
        if [ -f recovery-boot.bin ]; then
          mv -f recovery-boot.bin boot.bin
        fi
        rm -f sha256sums.txt
        FILES=$(ls | grep -v '^sha256sums.txt$' || true)
        if [ -n "$FILES" ]; then
          sha256sum $FILES > sha256sums.txt
        fi
        echo "--- 最终发布文件"
        ls -l
        cat sha256sums.txt 2>/dev/null || true

    - name: Upload to release
      if: always() && !cancelled() && hashFiles('firmware/*.bin') != ''
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_name }}
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: firmware/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        makeLatest: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always() && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/Build_sy108_UDX710.yml/runs?per_page=100"
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select(.status == "completed")
            | select((.created_at | fromdateiso8601) < ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ' 2>/dev/null || true)
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read -r run_id; do
            echo "Deleting run $run_id"
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
            echo ""
          done
        fi
