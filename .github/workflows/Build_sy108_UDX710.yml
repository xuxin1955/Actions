name: Build_sy108_UDX710

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  JOBS: 8
  DIY_SY108_SH: diy-sy108.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  FIRMWARE_DIR: ${{ github.workspace }}/firmware

concurrency:
  group: sy108-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: false

    - name: Initialization environment
      timeout-minutes: 12
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
        sudo find /etc/apt -maxdepth 2 -type f \( -name 'apt-mirrors.txt' -o -name '*.list' -o -name '*.sources' -o -name 'sources.list' \) -exec sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + || true
        printf 'Acquire::http::Timeout "15";\nAcquire::https::Timeout "15";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99timeout
        PKGS=$(curl -fsSL --retry 2 --max-time 30 https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt | tr ' ' '\n' | grep -vE '^(gcc-multilib|g\+\+-multilib|libc6-dev-i386)$' | tr '\n' ' ')
        [ -n "$PKGS" ] || { echo "::error::依赖列表拉取失败"; exit 1; }
        sudo -E apt-get -y install --no-install-recommends $PKGS || {
          sudo -E apt-get -y update
          sudo -E apt-get -y install --no-install-recommends $PKGS
        }
        sudo timedatectl set-timezone "${TZ}"

    - name: Clone ImmortalWrt source
      run: |
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
        echo "IMM_COMMIT=$(git -C openwrt rev-parse --short HEAD)" >> $GITHUB_ENV
        git -C openwrt log --oneline -1

    - name: Load custom DIY_SY108_SH
      run: |
        chmod +x "$DIY_SY108_SH"
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_SY108_SH

    - name: Update & Install feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a -f

    - name: Download package
      working-directory: ./openwrt
      run: |
        cp "$GITHUB_WORKSPACE/config/sy108.config" .config
        make defconfig
        make download -j$(nproc) -k V=s 2>&1 | tee /tmp/dl.log
        if grep -qiE 'Hash verification failed|checksum mismatch' /tmp/dl.log; then
          echo "::warning::download 有校验告警，继续尝试编译"
        fi
      shell: bash

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: Compile main firmware
      id: compile_main
      working-directory: ./openwrt
      run: |
        cp "$GITHUB_WORKSPACE/config/sy108.config" .config
        make defconfig
        make package/sy108-image/host/compile
        ls -l staging_dir/host/share/sy108-image/tools/image/capsule.py
        set +e
        make -j$JOBS
        RC=$?
        set -e
        if [ $RC -ne 0 ]; then
          echo "::warning::main 并行编译失败，切单线程详细模式"
          make -j1 V=s
        fi
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "===== main 产物 ====="
        ls -lh bin/targets/sprd/udx710/ | grep -E 'sysupgrade|kernel.bin|squashfs-rootfs' || true
        SYS=$(ls bin/targets/sprd/udx710/*squashfs-sysupgrade.bin 2>/dev/null | head -1)
        KERN=$(ls bin/targets/sprd/udx710/*sy108-kernel.bin 2>/dev/null | head -1)
        [ -n "$SYS" ]  || { echo "::error::sysupgrade.bin 缺失"; exit 1; }
        [ -n "$KERN" ] || { echo "::error::kernel.bin 缺失"; exit 1; }
        mkdir -p "$FIRMWARE_DIR"
        cp -f "$SYS" "$FIRMWARE_DIR/sysupgrade.bin"
        cp -f "$KERN" "$FIRMWARE_DIR/main-boot.bin"
        MF=$(ls bin/targets/sprd/udx710/*.manifest 2>/dev/null | head -1)
        [ -n "$MF" ] && cp -f "$MF" "$FIRMWARE_DIR/main.manifest" || true

    - name: Compile recovery firmware
      id: compile_recovery
      working-directory: ./openwrt
      run: |
        cp "$GITHUB_WORKSPACE/config/sy108_rec.config" .config
        make defconfig
        make package/clean
        set +e
        make -j$JOBS
        RC=$?
        set -e
        if [ $RC -ne 0 ]; then
          echo "::warning::recovery 并行编译失败，切单线程详细模式"
          make -j1 V=s
        fi

        echo "===== recovery 打包 ====="
        KDIR=$(ls -d build_dir/target-*/linux-sprd_udx710/linux-* 2>/dev/null | head -1)
        [ -d "$KDIR" ] || { echo "::error::未找到内核源码目录 $KDIR"; exit 1; }
        RD=$(ls bin/targets/sprd/udx710/*rootfs.cpio.gz 2>/dev/null | head -1)
        [ -n "$RD" ] || { echo "::error::rootfs.cpio.gz 缺失"; exit 1; }
        python3 staging_dir/host/share/sy108-image/tools/image/capsule.py \
          --image  "$KDIR/arch/arm64/boot/Image" \
          --dtb    "$KDIR/arch/arm64/boot/dts/sprd/udx710-sy108-recovery.dtb" \
          --ramdisk "$RD" \
          --target recovery \
          --output "$FIRMWARE_DIR/recovery.bin"
        echo "status=success" >> "$GITHUB_OUTPUT"

        echo "===== 产物清单 ====="
        ls -lh "$FIRMWARE_DIR"

    - name: Upload main firmware
      uses: actions/upload-artifact@main
      if: always() && steps.compile_main.outputs.status == 'success' && !cancelled()
      with:
        name: SY108_main_${{ env.IMM_COMMIT }}
        path: |
          ${{ env.FIRMWARE_DIR }}/sysupgrade.bin
          ${{ env.FIRMWARE_DIR }}/main-boot.bin

    - name: Upload recovery firmware
      uses: actions/upload-artifact@main
      if: always() && steps.compile_recovery.outputs.status == 'success' && !cancelled()
      with:
        name: SY108_recovery_${{ env.IMM_COMMIT }}
        path: ${{ env.FIRMWARE_DIR }}/recovery.bin

    - name: Prepare release
      id: tag
      if: always() && !cancelled()
      run: |
        TAG=$(date +"%Y.%m.%d-%H%M")
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT
        echo "release_name=SY108 华为5G通讯壳 ImmortalWrt 固件 (UDX710) $TAG" >> $GITHUB_OUTPUT

        mkdir -p firmware
        cp -f "$FIRMWARE_DIR/sysupgrade.bin" firmware/sysupgrade.bin 2>/dev/null || true
        cp -f "$FIRMWARE_DIR/recovery.bin"  firmware/recovery.bin  2>/dev/null || true

        : > release.txt
        MISS=""
        [ -f firmware/sysupgrade.bin ] || MISS="$MISS sysupgrade.bin"
        [ -f firmware/recovery.bin ]   || MISS="$MISS recovery.bin"
        echo "> **编译固件，待验证**" >> release.txt
        echo ">" >> release.txt
        echo "> 刷机提前备份原厂整套分区" >> release.txt
        if [ -n "$MISS" ]; then
          echo ">" >> release.txt
          echo "> 本次缺少:$MISS，该部分构建未成功，请勿按完整流程刷机。下载前先看下面 Assets 列表。" >> release.txt
        fi
        echo "" >> release.txt
        echo "- 源码: $REPO_URL" >> release.txt
        echo "- 分支: $REPO_BRANCH ($IMM_COMMIT)" >> release.txt
        KVER=$(grep -hE '^(kernel|kmod-usb-core) ' "$FIRMWARE_DIR"/*.manifest 2>/dev/null \
          | awk -F' - ' '{print $2}' \
          | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?([-~]?rc[0-9]+)?' | head -1)
        echo "- 内核版本: ${KVER:-未知}" >> release.txt
        echo "- 管理地址: 192.168.66.1" >> release.txt
        echo "- 登录账号: root" >> release.txt
        echo "- 密码: admin" >> release.txt

        echo "" >> release.txt
        echo "<details>" >> release.txt
        echo "<summary>主要插件</summary>" >> release.txt
        echo "" >> release.txt
        for m in "$FIRMWARE_DIR"/*.manifest; do
          [ -f "$m" ] || continue
          LIST=$(awk '{print $1}' "$m" \
            | sed -E 's/:.*$//; s/-[0-9][^-]*$//' \
            | grep -E '^(luci-app|udx)-' \
            | sort -u || true)
          [ -n "$LIST" ] && printf '%s\n' "$LIST" | sed 's/^/- /' >> release.txt
        done
        echo "" >> release.txt
        echo "</details>" >> release.txt
        rm -f "$FIRMWARE_DIR"/*.manifest

        ls -l firmware
        cat release.txt

    - name: Free disk for uboot
      id: disk
      if: always() && !cancelled()
      run: |
        du -sh "$GITHUB_WORKSPACE/openwrt" 2>/dev/null || true
        rm -rf "$GITHUB_WORKSPACE/openwrt/build_dir" \
               "$GITHUB_WORKSPACE/openwrt/staging_dir" \
               "$GITHUB_WORKSPACE/openwrt/tmp"
        AVAIL_MB=$(df -Pm / | awk 'NR==2{print $4}')
        echo "可用空间 ${AVAIL_MB} MiB"
        if [ "${AVAIL_MB:-0}" -lt 15360 ]; then
          echo "::warning::可用空间不足 15 GiB，跳过 U-Boot"
          echo "skip=1" >> "$GITHUB_OUTPUT"
        else
          echo "skip=0" >> "$GITHUB_OUTPUT"
        fi

    - name: Build uboot
      if: always() && !cancelled() && steps.disk.outputs.skip != '1'
      continue-on-error: true
      env:
        UBOOT_REPO: https://github.com/jason-liu-4980/sy108-uboot-spl
        UBOOT_IMAGE: udx710-boot:build
      run: |
        set +e
        MODELS="${MODELS:-p50pro m50p m50rs}"
        base=""
        for m in $MODELS; do
          if [ -f "sy108-oem/$m/splloader.bin" ] && [ -f "sy108-oem/$m/sml.bin" ]; then
            base="$m"; break
          fi
        done
        if [ -z "$base" ]; then
          echo "::notice::sy108-oem/ 下没有 splloader.bin + sml.bin，本次跳过 U-Boot"; exit 0
        fi
        for f in firmware/main-boot.bin firmware/recovery.bin; do
          [ -f "$f" ] || { echo "::warning::缺少 $f，跳过 U-Boot"; exit 0; }
        done
        git clone --depth 1 "$UBOOT_REPO" uboot-src || exit 0
        git -C uboot-src fetch --depth 1 origin oem:oem || exit 0
        make -C uboot-src offline LABEL=base \
          SPL_IMAGE="$PWD/sy108-oem/$base/splloader.bin" \
          SML_IMAGE="$PWD/sy108-oem/$base/sml.bin" \
          MAIN_CAPSULE="$PWD/firmware/main-boot.bin" \
          RECOVERY_CAPSULE="$PWD/firmware/recovery.bin" || exit 0

        : > uboot-rows.md
        ok=0
        for m in $MODELS; do
          d="sy108-oem/$m"
          [ -f "$d/splloader.bin" ] && [ -f "$d/sml.bin" ] || continue
          name="uboot-$m.bin"
          rm -rf "out-$m"; mkdir -p "out-$m"
          if docker run --rm --platform linux/amd64 --network none \
              --user "$(id -u):$(id -g)" \
              -v "$PWD/$d:/inputs:ro" \
              -v "$PWD/uboot-src/build/base:/base:ro" \
              -v "$PWD/out-$m:/out" \
              -v "$PWD/scripts/sy108:/scripts:ro" \
              --entrypoint /bin/sh "$UBOOT_IMAGE" \
              /scripts/verify-envelope.sh /base/uboot/u-boot-dtb.bin \
                /inputs/sml.bin /inputs/splloader.bin "/out/$name"; then
            mv "out-$m/$name" "firmware/$name"
            echo "| \`$m\` | \`$name\` | 实验 | \`$(sha256sum "firmware/$name" | cut -d' ' -f1)\` |" >> uboot-rows.md
            ok=1
          fi
        done
        if [ "$ok" = 1 ]; then
          {
            echo ""; echo "<details>"; echo "<summary>U-Boot 文件</summary>"; echo ""
            echo "| 机型 | 文件 | 状态 | sha256 |"; echo "|---|---|---|---|"
            cat uboot-rows.md; echo ""; echo "</details>"
          } >> release.txt
        fi
        cat uboot-rows.md 2>/dev/null || true
        exit 0

    - name: Trim release files
      if: always() && !cancelled()
      run: |
        [ -d firmware ] || exit 0
        cd firmware
        rm -f main-boot.bin sha256sums.txt
        echo "--- 最终发布文件"; ls -l

    - name: Append download acceleration
      if: always() && !cancelled() && env.UPLOAD_RELEASE == 'true'
      env:
        MIRROR: https://gh-proxy.com/
        TAG: ${{ steps.tag.outputs.release_tag }}
      run: |
        [ -f release.txt ] || exit 0
        FILES=$(find firmware -maxdepth 1 -type f -iname '*.bin' -printf '%f\n' 2>/dev/null | sort)
        [ -n "$FILES" ] || exit 0
        {
          echo ""; echo "<details>"; echo "<summary>固件下载 · 点击大小直接下载（国内加速）</summary>"; echo ""
          echo "> 蓝色数字是文件大小，点它直接开始下载。"
          echo ">"
          echo "> 点击后可能需要等待几秒才开始下载，请耐心等待，不要重复点击。"
          echo ""
          echo "| 文件 | 说明 | 大小 |"; echo "|---|---|---|"
        } >> release.txt
        printf '%s\n' "$FILES" | while IFS= read -r n; do
          [ -n "$n" ] || continue
          f="firmware/$n"
          sz=$(LC_ALL=C du -h "$f" | cut -f1)
          case "$n" in
            sysupgrade.bin) desc="系统固件 sysupgrade" ;;
            recovery.bin)   desc="恢复固件 recovery" ;;
            uboot-*.bin)    desc="U-Boot ${n#uboot-}" ;;
            *)              desc="固件" ;;
          esac
          u="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${n}"
          echo "| \`$n\` | $desc | [${sz}](${MIRROR}${u}) |" >> release.txt
        done
        { echo ""; echo "原始地址见下方 Assets 列表。"; echo ""; echo "</details>"; } >> release.txt
        cat release.txt

    - name: Upload to release
      if: always() && !cancelled() && env.UPLOAD_RELEASE == 'true' && hashFiles('firmware/*.bin') != ''
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_name }}
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: firmware/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        makeLatest: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always() && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        API="https://api.github.com/repos/${{ github.repository }}/actions/workflows/Build_sy108_UDX710.yml/runs?per_page=100"
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "$API")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select(.status == "completed")
            | select((.created_at | fromdateiso8601) < ($cutoff | tonumber))
            | {id, created_at} ]
          | sort_by(.created_at) | .[:-($keep)] | .[].id ' 2>/dev/null || true)
        if [ -z "$DEL_IDS" ]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read -r run_id; do
            echo "Deleting run $run_id"
            curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
