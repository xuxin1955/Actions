name: Build_sy108_UDX710

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/jason-liu-4980/sy108-mainline
  REPO_BRANCH: main
  JOBS: 4
  DIY_SY108_SH: diy-sy108.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  SY108_OUT: ${{ github.workspace }}/out
  SY108_DOWNLOADS: ${{ github.workspace }}/dl

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        profile: [main, recovery]
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ matrix.profile }}

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Show hardware info
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: Free Disk Space (Ubuntu)
      uses: insightsengineering/disk-space-reclaimer@v1.1.2
      with:
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false
        docker-images: false
        tools-cache: true

    - name: space usage check
      run: |
        df -H

    - name: Initialization environment
      id: init
      timeout-minutes: 25
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=15 -o Acquire::ForceIPv4=true"
        sudo -E apt-get $APT_OPTS -y update
        PKGS=$(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt | tr ' ' '\n' | grep -vE '^(gcc-multilib|g\+\+-multilib|libc6-dev-i386)$' | tr '\n' ' ')
        sudo -E apt-get $APT_OPTS -y install --no-install-recommends $PKGS
        sudo timedatectl set-timezone "${TZ}"
        echo "status=success" >> ${GITHUB_OUTPUT}

    - name: Clone source code
      id: codes
      if: steps.init.outputs.status == 'success' && success()
      run: |
        git clone --depth 1 "$REPO_URL" -b "$REPO_BRANCH" sy108
        cd sy108
        git log --oneline -1
        echo "SY108_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        cd ..
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Patch build scripts for CI
      working-directory: ./sy108
      run: |
        cat "$GITHUB_WORKSPACE/scripts/sy108/workspace_overlay.py" >> tools/lib/workspace.py
        PROBE=$(./tools/python -c "import sys; sys.path.insert(0,'tools/lib'); from workspace import container; print(container(['echo','hi'])[0])")
        test "$PROBE" = "echo" || { echo "::error::container() override not applied, got: $PROBE"; exit 1; }

        sed -i 's|raise SystemExit("Linux archive checksum mismatch")|print(f"::warning::kernel archive sha256={digest}, manifest mismatch ignored")|' tools/build/kernel-source.py
        sed -i "s/'V=s'/'V=' + __import__('os').environ.get('V','0')/g" tools/build/firmware.py
        grep -n "'V='" tools/build/firmware.py

    - name: Map build paths
      run: |
        mkdir -p "$SY108_OUT" "$SY108_DOWNLOADS"
        sudo ln -sfn "$GITHUB_WORKSPACE/sy108" /project
        sudo ln -sfn "$SY108_OUT" /output
        sudo ln -sfn "$SY108_DOWNLOADS" /downloads
        ls -ld /project /output /downloads

    - name: Update & Install feeds (bootstrap)
      working-directory: ./sy108
      run: |
        ./tools/python tools/bootstrap.py --skip-container
        git -C "$SY108_OUT/openwrt-build" log --oneline -1

    - name: Load custom DIY_SY108_SH
      run: |
        [ -f "$DIY_SY108_SH" ] || exit 0
        chmod +x "$DIY_SY108_SH"
        cd "$SY108_OUT/openwrt-build"
        $GITHUB_WORKSPACE/$DIY_SY108_SH

    - name: Restore package cache
      id: dcache
      uses: actions/cache/restore@v5.1.0
      with:
        path: |
          dl
        key: sy108-dl-${{ hashFiles('sy108/manifests/*.json') }}
        restore-keys: |
          sy108-dl-

    - name: Download package
      working-directory: ./sy108
      run: |
        ./tools/python tools/build/firmware.py "$PROFILE" --configure-only
        KARC=$(jq -r .archive manifests/kernel.json)
        cd "$SY108_OUT/openwrt-build"
        make download -j8 LINUX_SOURCE="$KARC" LINUX_SITE=file:///downloads
        find dl/ -size -1024c -delete

    - name: Save package cache
      continue-on-error: true
      if: steps.dcache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.1.0
      with:
        path: |
          dl
        key: ${{ steps.dcache.outputs.cache-primary-key }}

    - name: SSH 调试有效时间6h! 连接后输入q 输入exit即可退出，自动继续后续编译流程
      uses: WarpBuilds/action-debugger@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: 自动上传最新源码生成.config编译配置
      uses: actions/upload-artifact@main
      with:
       name: build-config
       path: |
         ${{ env.SY108_OUT }}/openwrt-build/.config
         ${{ env.SY108_OUT }}/openwrt-build/feeds.conf
       include-hidden-files: true

    - name: Compile the SY108 firmware
      id: compile
      working-directory: ./sy108
      run: |
        if ! ./tools/python tools/build/firmware.py "$PROFILE" --jobs "$JOBS"; then
            echo "Compile failed, retry with -j2 V=s"
            V=s ./tools/python tools/build/firmware.py "$PROFILE" --jobs 2
        fi

        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd "$SY108_OUT/images/$PROFILE"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: SY108_firmware_${{ env.PROFILE }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}/*

  release:
    needs: build
    runs-on: ubuntu-24.04

    steps:
    - name: Download firmware
      uses: actions/download-artifact@main
      with:
        pattern: SY108_firmware_*
        path: firmware

    - name: Prepare release
      id: tag
      run: |
        TAG=$(date +"%Y.%m.%d-%H%M")
        echo "release_tag=$TAG" >> $GITHUB_OUTPUT
        echo "release_name=SY108 华为5G通讯壳 OpenWrt 固件 (UDX710) $TAG" >> $GITHUB_OUTPUT
        : > release.txt
        for d in firmware/*/; do
          [ -d "$d" ] || continue
          p=$(basename "$d" | sed -E 's/^SY108_firmware_//; s/_[0-9]{12}$//')
          for f in "$d"*; do
            mv "$f" "firmware/${p}-$(basename "$f")"
          done
          rmdir "$d" 2>/dev/null || true
        done
        cd firmware
        ls | grep -vE '^((main|recovery)-(boot\.bin|rootfs\.squashfs|sysupgrade\.bin|build\.json|openwrt\.config|openwrt-sprd-udx710-(main|recovery)\.manifest))$' | xargs -r rm -f || true
        sha256sum * > sha256sums.txt
        cd ..
        KVER=$(jq -r '.kernel.version' firmware/main-build.json 2>/dev/null || echo unknown)
        echo "源码: $REPO_URL" >> release.txt
        echo "分支: $REPO_BRANCH" >> release.txt
        echo "内核版本: $KVER" >> release.txt
        echo "管理地址: 192.168.66.1" >> release.txt
        echo "登录账号: root" >> release.txt
        echo "密码: admin" >> release.txt
        echo "" >> release.txt
        for m in firmware/main-*.manifest; do
          [ -f "$m" ] || continue
          P=$(basename "$m" | cut -d- -f1)
          LIST=$(awk '{print $1}' "$m" \
            | sed -E 's/:.*$//; s/-[0-9][^-]*$//' \
            | grep -E '^(luci-app|udx)-' \
            | sort -u || true)
          echo "#### $P 插件" >> release.txt
          if [ -n "$LIST" ]; then
            printf '%s\n' "$LIST" | sed 's/^/- /' >> release.txt
          fi
          echo "" >> release.txt
        done
        cat release.txt

    - name: Upload to release
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: ${{ steps.tag.outputs.release_name }}
        tag: ${{ steps.tag.outputs.release_tag }}
        bodyFile: release.txt
        artifacts: firmware/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        makeLatest: true
        draft: false
        prerelease: false

    - name: Delete old workflow runs via GitHub API
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 2
        KEEP_MINIMUM_RUNS: 2
      run: |
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "No old runs to delete."
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "Deleting run $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
        fi
